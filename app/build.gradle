plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fil.lyricswidget'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'com.fil.lyricswidget'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Release signing comes from keystore.properties (not in git). Without it,
    // release builds fall back to the debug key so anyone can build an installable APK.
    def keystoreFile = rootProject.file('keystore.properties')
    def hasKeystore = keystoreFile.exists()
    signingConfigs {
        if (hasKeystore) {
            def props = new Properties()
            keystoreFile.withInputStream { props.load(it) }
            release {
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
